<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Tap</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#070b16;
  color:white;
  font-family:Arial,sans-serif
}

.app{
  width:min(430px,94vw);
  padding:20px;
  background:#0d1426;
  border:1px solid #24304a;
  border-radius:24px
}

.logo{
  text-align:center;
  font-size:26px;
  font-weight:900;
  margin-bottom:20px
}

.logo span{color:#38bdf8}

.card{
  background:#111b30;
  padding:16px;
  border-radius:15px;
  margin-bottom:12px
}

.label{
  color:#94a3b8;
  font-size:12px
}

input{
  width:100%;
  padding:13px;
  margin:10px 0;
  background:#09111f;
  border:1px solid #334155;
  border-radius:10px;
  color:white
}

button{
  border:0;
  cursor:pointer
}

.main{
  width:100%;
  padding:14px;
  background:#38bdf8;
  color:#04111c;
  border-radius:11px;
  font-weight:900
}

.main:disabled{
  opacity:.5;
  cursor:not-allowed
}

.points{
  font-size:38px;
  font-weight:900;
  color:#38bdf8;
  margin-top:5px
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.stat{
  background:#111b30;
  padding:13px;
  border-radius:12px;
  text-align:center
}

.stat strong{
  display:block;
  font-size:20px;
  margin-top:4px
}

.game{
  position:relative;
  height:330px;
  margin-top:12px;
  background:#09111f;
  border:1px solid #24304a;
  border-radius:17px;
  overflow:hidden
}

.target{
  display:none;
  position:absolute;
  width:72px;
  height:72px;
  border-radius:50%;
  background:#38bdf8;
  color:#04111c;
  font-size:25px;
  font-weight:900
}

.center{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:180px
}

.timer{
  text-align:center;
  font-size:30px;
  font-weight:900;
  color:#38bdf8;
  margin:12px
}

.message{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin:10px
}

.error{
  color:#fb7185;
  font-size:13px;
  margin-top:8px
}

.hidden{
  display:none
}

.rank{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #24304a
}

.rank:last-child{
  border-bottom:0
}

.rank-points{
  color:#38bdf8;
  font-weight:bold
}
</style>
</head>

<body>

<div class="app">

<div class="logo">
⚡ CRYPTO<span>TAP</span>
</div>


<!-- LOGIN -->

<div id="loginScreen">

<div class="card">

<div class="label">
PLAYER
</div>

<input
id="username"
maxlength="30"
placeholder="Nhập username"
>

<button
id="loginButton"
class="main"
>
ENTER GAME
</button>

<div
id="error"
class="error"
></div>

</div>

</div>


<!-- GAME -->

<div
id="gameScreen"
class="hidden"
>


<!-- POINTS -->

<div class="card">

<div class="label">
YOUR POINTS
</div>

<div
id="points"
class="points"
>
0
</div>

</div>


<!-- DAILY BONUS -->

<div class="card">

<div class="label">
🎁 DAILY BONUS
</div>

<div style="
font-size:18px;
font-weight:bold;
margin-top:5px
">
+100 POINT
</div>

<button
id="bonusButton"
class="main"
style="margin-top:10px"
>
CLAIM BONUS
</button>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="label">
ROUNDS TODAY
</div>

<strong id="roundsToday">
0 / 100
</strong>

</div>


<div class="stat">

<div class="label">
ROUND SCORE
</div>

<strong id="roundScore">
0
</strong>

</div>

</div>


<!-- TIMER -->

<div
id="timer"
class="timer"
>
15
</div>


<!-- GAME -->

<div
id="game"
class="game"
>

<button
id="startButton"
class="main center"
>
START
</button>


<button
id="target"
class="target"
>
⚡
</button>

</div>


<div
id="message"
class="message"
>
15 giây — tap mục tiêu
</div>


<!-- TOP -->

<div class="card">

<div class="label">
🏆 TOP 10 PLAYERS
</div>

<div
id="leaderboard"
style="margin-top:8px"
>
Đang tải...
</div>

</div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qsbuwbdyajoxlsrruzzg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z7BmFlVoVQu3wCjquLsOHQ_joQwJoaT";


/* =========================
   STATE
========================= */

let username = "";

let points = 0;

let taps = 0;

let playing = false;

let seconds = 15;

let timer = null;


/* =========================
   ELEMENTS
========================= */

const loginScreen =
document.getElementById("loginScreen");

const gameScreen =
document.getElementById("gameScreen");

const usernameInput =
document.getElementById("username");

const loginButton =
document.getElementById("loginButton");

const errorBox =
document.getElementById("error");

const pointsBox =
document.getElementById("points");

const roundsBox =
document.getElementById("roundsToday");

const roundScoreBox =
document.getElementById("roundScore");

const timerBox =
document.getElementById("timer");

const startButton =
document.getElementById("startButton");

const target =
document.getElementById("target");

const game =
document.getElementById("game");

const message =
document.getElementById("message");

const bonusButton =
document.getElementById("bonusButton");

const leaderboard =
document.getElementById("leaderboard");


/* =========================
   HEADERS
========================= */

function headers(){

return {
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
};

}


/* =========================
   LOGIN
========================= */

loginButton.onclick =
async function(){

const name =
usernameInput.value.trim();


if(!name){

errorBox.textContent =
"Nhập username.";

return;

}


loginButton.disabled =
true;

loginButton.textContent =
"CONNECTING...";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/players"+
"?username=eq."+
encodeURIComponent(name)+
"&select=username,points",

{
headers:headers()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const players =
await response.json();


/* EXISTING */

if(players.length){

username =
players[0].username;

}


/* NEW */

else{

const create =
await fetch(

SUPABASE_URL+
"/rest/v1/players",

{

method:"POST",

headers:{
...headers(),
"Content-Type":
"application/json",
"Prefer":
"return=representation"
},

body:JSON.stringify({

username:name,
points:0

})

}

);


if(!create.ok){

throw new Error(
await create.text()
);

}


const created =
await create.json();


username =
created[0].username;

}


await loadPlayer();


loginScreen.classList.add(
"hidden"
);

gameScreen.classList.remove(
"hidden"
);


await loadRounds();

await loadLeaderboard();


message.textContent =
"Connected ✅";


}catch(error){

console.error(error);

errorBox.textContent =
"Database error: "+
error.message;

}finally{

loginButton.disabled =
false;

loginButton.textContent =
"ENTER GAME";

}

};


/* =========================
   LOAD PLAYER
========================= */

async function loadPlayer(){

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/players"+
"?username=eq."+
encodeURIComponent(username)+
"&select=points",

{
headers:headers()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

throw new Error(
"Player not found"
);

}


points =
Number(data[0].points||0);


pointsBox.textContent =
points.toLocaleString();

}


/* =========================
   LOAD ROUNDS
========================= */

async function loadRounds(){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/game_rounds"+
"?username=eq."+
encodeURIComponent(username)+
"&select=id,created_at",

{
headers:headers()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


const today =
new Date().toISOString()
.slice(0,10);


const count =
data.filter(
row =>
String(row.created_at)
.startsWith(today)
).length;


roundsBox.textContent =
Math.min(count,100)+
" / 100";


if(count>=100){

startButton.disabled =
true;

startButton.textContent =
"LIMIT REACHED";

}else{

startButton.disabled =
false;

}

}catch(error){

console.error(error);

startButton.disabled =
false;

}

}


/* =========================
   LEADERBOARD
========================= */

async function loadLeaderboard(){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/leaderboard"+
"?select=username,points"+
"&limit=10",

{
headers:headers()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


leaderboard.innerHTML =
data.map(
(player,index)=>`

<div class="rank">

<span>
${index+1}.
${String(
player.username||""
).replace(
/[&<>"']/g,
""
)}
</span>

<span class="rank-points">
${Number(
player.points||0
).toLocaleString()}
</span>

</div>

`
).join("");


}catch(error){

leaderboard.innerHTML =
"Không tải được TOP.";

}

}


/* =========================
   MOVE TARGET
========================= */

function moveTarget(){

const size = 72;

const maxX =
game.clientWidth-size;

const maxY =
game.clientHeight-size;


target.style.left =
Math.random()*
Math.max(1,maxX)+
"px";

target.style.top =
Math.random()*
Math.max(1,maxY)+
"px";

}


/* =========================
   START
========================= */

startButton.onclick =
function(){

if(playing)
return;


playing =
true;

taps =
0;

seconds =
15;


roundScoreBox.textContent =
"0";

timerBox.textContent =
"15";


startButton.style.display =
"none";

target.style.display =
"block";


message.textContent =
"⚡ TAP!";


moveTarget();


timer =
setInterval(

function(){

seconds--;

timerBox.textContent =
seconds;


if(seconds<=0){

finishRound();

}

},

1000

);

};


/* =========================
   TAP
========================= */

target.onclick =
function(){

if(!playing)
return;


taps++;


roundScoreBox.textContent =
taps;


moveTarget();

};


/* =========================
   FINISH
========================= */

async function finishRound(){

if(!playing)
return;


playing =
false;


clearInterval(timer);


target.style.display =
"none";

startButton.style.display =
"block";

startButton.textContent =
"PLAY AGAIN";


message.textContent =
"Đang tính điểm...";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/rpc/finish_game_round",

{

method:"POST",

headers:{
...headers(),
"Content-Type":
"application/json"
},

body:JSON.stringify({

p_username:
username,

p_taps:
taps

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const reward =
Number(
await response.json()
);


points +=
reward;


pointsBox.textContent =
points.toLocaleString();


roundScoreBox.textContent =
reward;


message.textContent =
"🎉 +"+
reward+
" POINT";


await loadRounds();

await loadLeaderboard();


}catch(error){

console.error(
"FINISH ERROR:",
error
);

message.textContent =
"❌ "+error.message;

}

}


/* =========================
   DAILY BONUS
========================= */

bonusButton.onclick =
async function(){

bonusButton.disabled =
true;

bonusButton.textContent =
"CHECKING...";


try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/rpc/claim_daily_bonus",

{

method:"POST",

headers:{
...headers(),
"Content-Type":
"application/json"
},

body:JSON.stringify({

p_username:
username

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const reward =
Number(
await response.json()
);


if(reward>0){

points +=
reward;


pointsBox.textContent =
points.toLocaleString();


bonusButton.textContent =
"CLAIMED TODAY";


message.textContent =
"🎁 +"+
reward+
" POINT";

}else{

bonusButton.textContent =
"ALREADY CLAIMED";

message.textContent =
"Đã nhận Daily Bonus hôm nay.";

}

await loadLeaderboard();


}catch(error){

console.error(error);

bonusButton.disabled =
false;

bonusButton.textContent =
"CLAIM BONUS";

message.textContent =
"❌ "+error.message;

}

};

</script>

</body>
</html>
