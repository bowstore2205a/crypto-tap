<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Tap</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:#070b16;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,input{
    font-family:inherit;
}

button{
    cursor:pointer;
    touch-action:manipulation;
}

.hidden{
    display:none!important;
}

.app{
    width:min(460px,94vw);
    margin:25px auto;
    padding:18px;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:18px;
}

.logo span{
    color:#38bdf8;
}

.card{
    background:#111a2d;
    border:1px solid #263756;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
}

.label{
    color:#91a0b8;
    font-size:12px;
    font-weight:700;
}

input{
    width:100%;
    height:48px;
    margin-top:10px;
    padding:0 14px;
    border:1px solid #33435f;
    border-radius:10px;
    outline:none;
    background:#09111f;
    color:#fff;
}

input:focus{
    border-color:#38bdf8;
}

.main{
    width:100%;
    min-height:48px;
    margin-top:10px;
    border:0;
    border-radius:11px;
    background:#38bdf8;
    color:#03101a;
    font-size:15px;
    font-weight:900;
}

.main:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.points{
    margin-top:5px;
    color:#38bdf8;
    font-size:40px;
    line-height:1;
    font-weight:900;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
}

.stat{
    background:#111a2d;
    border:1px solid #263756;
    border-radius:14px;
    padding:14px;
    text-align:center;
}

.stat strong{
    display:block;
    margin-top:6px;
    font-size:20px;
}

.timer{
    margin:10px 0;
    text-align:center;
    color:#38bdf8;
    font-size:34px;
    font-weight:900;
}

.game{
    position:relative;
    width:100%;
    height:350px;
    overflow:hidden;
    background:#080f1d;
    border:1px solid #263756;
    border-radius:18px;
}

#startButton{
    position:absolute;
    width:180px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    margin:0;
}

.target{
    display:none;
    position:absolute;
    width:72px;
    height:72px;
    margin:0;
    padding:0;
    border:0;
    border-radius:50%;
    background:#38bdf8;
    color:#03101a;
    font-size:28px;
    font-weight:900;
    z-index:20;
    box-shadow:0 0 25px rgba(56,189,248,.4);
}

.message{
    min-height:20px;
    margin:10px 0;
    text-align:center;
    color:#91a0b8;
    font-size:13px;
}

.error{
    min-height:18px;
    margin-top:8px;
    color:#fb7185;
    font-size:13px;
    word-break:break-word;
}

.rank{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #263756;
}

.rank:last-child{
    border-bottom:0;
}

.rank-points{
    color:#38bdf8;
    font-weight:900;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">
⚡ CRYPTO<span>TAP</span>
</div>


<!-- LOGIN -->

<div id="loginScreen">

<div class="card">

<div class="label">
PLAYER
</div>

<input
id="username"
maxlength="30"
autocomplete="off"
placeholder="Nhập username"
>

<button
id="loginButton"
class="main"
type="button"
>
ENTER GAME
</button>

<div
id="loginError"
class="error"
></div>

</div>

</div>


<!-- GAME -->

<div
id="gameScreen"
class="hidden"
>

<div class="card">

<div class="label">
YOUR POINTS
</div>

<div
id="points"
class="points"
>
0
</div>

</div>


<div class="card">

<div class="label">
🎁 DAILY BONUS
</div>

<div
style="
margin-top:6px;
font-size:18px;
font-weight:900;
"
>
+100 POINT
</div>

<button
id="bonusButton"
class="main"
type="button"
>
CLAIM BONUS
</button>

</div>


<div class="stats">

<div class="stat">

<div class="label">
ROUNDS TODAY
</div>

<strong id="roundsToday">
0 / 100
</strong>

</div>


<div class="stat">

<div class="label">
ROUND SCORE
</div>

<strong id="roundScore">
0
</strong>

</div>

</div>


<div
id="timer"
class="timer"
>
15
</div>


<div
id="game"
class="game"
>

<button
id="startButton"
class="main"
type="button"
>
START
</button>


<button
id="target"
class="target"
type="button"
>
⚡
</button>

</div>


<div
id="message"
class="message"
>
15 giây — tap mục tiêu
</div>


<div class="card">

<div class="label">
🏆 TOP 10 PLAYERS
</div>

<div
id="leaderboard"
style="margin-top:8px"
>
Đang tải...
</div>

</div>

</div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://qsbuwbdyajoxlsrruzzg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z7BmFlVoVQu3wCjquLsOHQ_joQwJoaT";


/* =====================================================
   CONFIG
===================================================== */

const ROUND_SECONDS = 15;

const MAX_ROUNDS = 100;


/* =====================================================
   STATE
===================================================== */

let username = "";

let points = 0;

let rounds = 0;

let taps = 0;

let seconds = ROUND_SECONDS;

let playing = false;

let finishing = false;

let timer = null;


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
document.getElementById("loginScreen");

const gameScreen =
document.getElementById("gameScreen");

const usernameInput =
document.getElementById("username");

const loginButton =
document.getElementById("loginButton");

const loginError =
document.getElementById("loginError");

const pointsElement =
document.getElementById("points");

const roundsElement =
document.getElementById("roundsToday");

const roundScoreElement =
document.getElementById("roundScore");

const timerElement =
document.getElementById("timer");

const startButton =
document.getElementById("startButton");

const target =
document.getElementById("target");

const game =
document.getElementById("game");

const message =
document.getElementById("message");

const bonusButton =
document.getElementById("bonusButton");

const leaderboard =
document.getElementById("leaderboard");


/* =====================================================
   HEADERS
===================================================== */

function headers(){

return{

apikey:SUPABASE_KEY,

Authorization:
"Bearer "+SUPABASE_KEY,

"Content-Type":
"application/json"

};

}


/* =====================================================
   MESSAGE
===================================================== */

function setMessage(text){

message.textContent=text;

}


/* =====================================================
   LOGIN
===================================================== */

loginButton.onclick=login;


usernameInput.onkeydown=function(e){

if(e.key==="Enter"){

login();

}

};


async function login(){

const name =
usernameInput.value.trim();


loginError.textContent="";


if(!name){

loginError.textContent =
"Nhập username.";

return;

}


loginButton.disabled=true;

loginButton.textContent =
"CONNECTING...";


try{


/* CHECK PLAYER */

const check =
await fetch(

SUPABASE_URL+
"/rest/v1/players"+
"?username=eq."+
encodeURIComponent(name)+
"&select=username,points",

{
headers:headers()
}

);


if(!check.ok){

throw new Error(
await check.text()
);

}


const data =
await check.json();


/* CREATE PLAYER */

if(data.length===0){

const create =
await fetch(

SUPABASE_URL+
"/rest/v1/players",

{

method:"POST",

headers:{
...headers(),
Prefer:"return=representation"
},

body:JSON.stringify({

username:name,

points:0

})

}

);


if(!create.ok){

throw new Error(
await create.text()
);

}

}


username=name;


/*
LOAD EVERYTHING
*/

await loadPoints();

await loadRounds();

await loadLeaderboard();


loginScreen.classList.add(
"hidden"
);

gameScreen.classList.remove(
"hidden"
);


setMessage(
"Đăng nhập thành công ✅"
);


}catch(error){

console.error(
"LOGIN:",
error
);

loginError.textContent =
"❌ "+error.message;


}finally{

loginButton.disabled=false;

loginButton.textContent =
"ENTER GAME";

}

}


/* =====================================================
   POINTS
===================================================== */

async function loadPoints(){

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/players"+
"?username=eq."+
encodeURIComponent(username)+
"&select=points",

{
headers:headers()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

throw new Error(
"Player không tồn tại."
);

}


points =
Number(
data[0].points || 0
);


pointsElement.textContent =
points.toLocaleString();

}


/* =====================================================
   ROUNDS
===================================================== */

async function loadRounds(){

try{


/*
  DÙNG RPC ĐÃ CÓ TRÊN DATABASE.

  Đây là cách duy nhất frontend
  không bị RLS của game_rounds.
*/

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/rpc/get_rounds_today",

{

method:"POST",

headers:headers(),

body:JSON.stringify({

p_username:username

})

}

);


if(!response.ok){

const errorText =
await response.text();

console.error(
"GET ROUNDS:",
errorText
);

return;

}


const result =
await response.json();


/*
  RPC có thể trả number,
  string hoặc object.
*/

if(
typeof result==="number"
){

rounds=result;

}

else if(
typeof result==="string"
){

rounds=Number(result);

}

else if(
result &&
typeof result==="object"
){

if(
result.rounds_today!==undefined
){

rounds=
Number(
result.rounds_today
);

}

else if(
result.count!==undefined
){

rounds=
Number(
result.count
);

}

else{

rounds=0;

}

}

else{

rounds=0;

}


if(
!Number.isFinite(rounds)
){

rounds=0;

}


roundsElement.textContent =
rounds+" / "+MAX_ROUNDS;


if(
!playing &&
!finishing
){

if(
rounds>=MAX_ROUNDS
){

startButton.disabled=true;

startButton.textContent=
"LIMIT REACHED";

}

else{

startButton.disabled=false;

startButton.textContent=
"START";

}

}


}catch(error){

console.error(
"ROUNDS:",
error
);

}

}


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard(){

try{

const response =
await fetch(

SUPABASE_URL+
"/rest/v1/leaderboard"+
"?select=username,points"+
"&limit=10",

{
headers:headers()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

leaderboard.textContent =
"Chưa có người chơi.";

return;

}


leaderboard.innerHTML =
data.map(
(player,index)=>{

const safe =
String(
player.username || ""
)
.replace(
/[&<>"']/g,
""
);


const score =
Number(
player.points || 0
);


return`

<div class="rank">

<span>
${index+1}. ${safe}
</span>

<span class="rank-points">
${score.toLocaleString()}
</span>

</div>

`;

}
).join("");


}catch(error){

console.error(
"TOP:",
error
);

leaderboard.textContent =
"Không tải được TOP.";

}

}


/* =====================================================
   MOVE TARGET
===================================================== */

function moveTarget(){

const size=72;


const maxX =
Math.max(
0,
game.clientWidth-size
);


const maxY =
Math.max(
0,
game.clientHeight-size
);


target.style.left =
Math.random()*maxX+"px";


target.style.top =
Math.random()*maxY+"px";

}


/* =====================================================
   START
===================================================== */

startButton.onclick=startRound;


async function startRound(){

if(playing)return;

if(finishing)return;


if(rounds>=MAX_ROUNDS){

setMessage(
"Đã đạt giới hạn 100 round."
);

return;

}


startButton.disabled=true;

startButton.textContent=
"STARTING...";


setMessage(
"⏳ Đang bắt đầu round..."
);


try{


const response =
await fetch(

SUPABASE_URL+
"/rest/v1/rpc/start_game_round",

{

method:"POST",

headers:headers(),

body:JSON.stringify({

p_username:username

})

}

);


if(!response.ok){

const text =
await response.text();


if(
text.includes(
"Round already active"
)
){

setMessage(
"⚠️ Round đang active trên server."
);

startButton.disabled=false;

startButton.textContent=
"START";

return;

}


throw new Error(text);

}


/*
  START THÀNH CÔNG
*/

playing=true;

finishing=false;

taps=0;

seconds=ROUND_SECONDS;


roundScoreElement.textContent=
"0";

timerElement.textContent=
seconds;


startButton.style.display=
"none";


target.style.display=
"block";


setMessage(
"⚡ TAP!"
);


moveTarget();


clearInterval(timer);


timer =
setInterval(
function(){

seconds--;

timerElement.textContent=
seconds;


if(seconds<=0){

clearInterval(timer);

timer=null;

finishRound();

}

},
1000
);


}catch(error){

console.error(
"START:",
error
);


playing=false;


target.style.display=
"none";


startButton.style.display=
"block";

startButton.disabled=false;

startButton.textContent=
"START";


setMessage(
"❌ "+error.message
);

}

}


/* =====================================================
   TAP
===================================================== */

target.onclick=function(event){

event.preventDefault();

event.stopPropagation();


if(!playing)return;

if(finishing)return;


taps++;


roundScoreElement.textContent=
taps;


moveTarget();

};


/* =====================================================
   FINISH
===================================================== */

async function finishRound(){

if(finishing)return;


finishing=true;

playing=false;


clearInterval(timer);

timer=null;


target.style.display=
"none";


setMessage(
"💾 Đang lưu round..."
);


try{


const response =
await fetch(

SUPABASE_URL+
"/rest/v1/rpc/finish_game_round",

{

method:"POST",

headers:headers(),

body:JSON.stringify({

p_username:username,

p_taps:taps

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const result =
await response.json();


const reward =
Number(result || 0);


/*
  ĐỌC LẠI DATABASE
*/

await loadPoints();

await loadRounds();

await loadLeaderboard();


roundScoreElement.textContent =
reward.toLocaleString();


setMessage(
"🎉 +"+
reward.toLocaleString()+
" POINT"
);


}catch(error){

console.error(
"FINISH:",
error
);

setMessage(
"❌ "+error.message
);

}


finishing=false;


startButton.style.display=
"block";


if(rounds>=MAX_ROUNDS){

startButton.disabled=true;

startButton.textContent=
"LIMIT REACHED";

}

else{

startButton.disabled=false;

startButton.textContent=
"START";

}

}


/* =====================================================
   DAILY BONUS
===================================================== */

bonusButton.onclick=
claimBonus;


async function claimBonus(){

bonusButton.disabled=true;

bonusButton.textContent=
"CHECKING...";


try{


const response =
await fetch(

SUPABASE_URL+
"/rest/v1/rpc/claim_daily_bonus",

{

method:"POST",

headers:headers(),

body:JSON.stringify({

p_username:username

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const result =
await response.json();


const reward =
Number(result || 0);


await loadPoints();

await loadLeaderboard();


if(reward>0){

bonusButton.textContent=
"CLAIMED TODAY";


setMessage(
"🎁 +"+
reward.toLocaleString()+
" POINT"
);

}

else{

bonusButton.textContent=
"ALREADY CLAIMED";

}


}catch(error){

console.error(
"BONUS:",
error
);


bonusButton.disabled=false;

bonusButton.textContent=
"CLAIM BONUS";


setMessage(
"❌ "+error.message
);

}

}


/* =====================================================
   INITIAL
===================================================== */

timerElement.textContent=
ROUND_SECONDS;

roundScoreElement.textContent=
"0";

</script>

</body>
</html>
