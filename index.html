<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crypto Tap</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    background:#070b16;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.app{
    width:min(460px,94vw);
    margin:30px auto;
    padding:18px;
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:900;
    margin-bottom:18px;
}

.logo span{
    color:#38bdf8;
}

.card{
    background:#111a2d;
    border:1px solid #243452;
    border-radius:16px;
    padding:16px;
    margin-bottom:12px;
}

.label{
    color:#8fa0bb;
    font-size:12px;
    font-weight:700;
}

input{
    width:100%;
    height:48px;
    margin-top:10px;
    padding:0 14px;
    border-radius:10px;
    border:1px solid #33435f;
    background:#09101e;
    color:#fff;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#38bdf8;
}

.main{
    width:100%;
    min-height:48px;
    margin-top:10px;
    border:0;
    border-radius:11px;
    background:#38bdf8;
    color:#03101a;
    font-size:15px;
    font-weight:900;
}

.main:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.points{
    margin-top:5px;
    font-size:40px;
    line-height:1;
    color:#38bdf8;
    font-weight:900;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:12px;
}

.stat{
    background:#111a2d;
    border:1px solid #243452;
    border-radius:14px;
    padding:14px;
    text-align:center;
}

.stat strong{
    display:block;
    margin-top:6px;
    font-size:20px;
}

.timer{
    text-align:center;
    font-size:34px;
    font-weight:900;
    color:#38bdf8;
    margin:10px 0;
}

.game{
    position:relative;
    width:100%;
    height:350px;
    overflow:hidden;
    background:#080f1d;
    border:1px solid #263756;
    border-radius:18px;
}

#startButton{
    position:absolute;
    width:180px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    margin:0;
}

.target{
    display:none;
    position:absolute;
    width:72px;
    height:72px;
    margin:0;
    padding:0;
    border:0;
    border-radius:50%;
    background:#38bdf8;
    color:#03101a;
    font-size:28px;
    font-weight:900;
    z-index:50;
    box-shadow:0 0 28px rgba(56,189,248,.4);
}

.message{
    min-height:20px;
    margin:10px 0;
    text-align:center;
    color:#91a0b8;
    font-size:13px;
}

.error{
    min-height:18px;
    margin-top:8px;
    color:#fb7185;
    font-size:13px;
    word-break:break-word;
}

.rank{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #243452;
}

.rank:last-child{
    border-bottom:0;
}

.rank-points{
    color:#38bdf8;
    font-weight:900;
}

.status-ok{
    color:#4ade80;
}

.status-error{
    color:#fb7185;
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">
        ⚡ CRYPTO<span>TAP</span>
    </div>


    <!-- LOGIN -->

    <section id="loginScreen">

        <div class="card">

            <div class="label">
                PLAYER
            </div>

            <input
                id="username"
                maxlength="30"
                autocomplete="off"
                placeholder="Nhập username"
            >

            <button
                id="loginButton"
                class="main"
                type="button"
            >
                ENTER GAME
            </button>

            <div
                id="loginError"
                class="error"
            ></div>

        </div>

    </section>


    <!-- GAME -->

    <section
        id="gameScreen"
        class="hidden"
    >

        <!-- POINT -->

        <div class="card">

            <div class="label">
                YOUR POINTS
            </div>

            <div
                id="points"
                class="points"
            >
                0
            </div>

        </div>


        <!-- BONUS -->

        <div class="card">

            <div class="label">
                🎁 DAILY BONUS
            </div>

            <div
                style="
                    margin-top:6px;
                    font-size:18px;
                    font-weight:900;
                "
            >
                +100 POINT
            </div>

            <button
                id="bonusButton"
                class="main"
                type="button"
            >
                CLAIM BONUS
            </button>

        </div>


        <!-- STATS -->

        <div class="stats">

            <div class="stat">

                <div class="label">
                    ROUNDS TODAY
                </div>

                <strong id="roundsToday">
                    0 / 100
                </strong>

            </div>


            <div class="stat">

                <div class="label">
                    ROUND SCORE
                </div>

                <strong id="roundScore">
                    0
                </strong>

            </div>

        </div>


        <!-- TIMER -->

        <div
            id="timer"
            class="timer"
        >
            15
        </div>


        <!-- GAME -->

        <div
            id="game"
            class="game"
        >

            <button
                id="startButton"
                class="main"
                type="button"
            >
                START
            </button>


            <button
                id="target"
                class="target"
                type="button"
            >
                ⚡
            </button>

        </div>


        <div
            id="message"
            class="message"
        >
            15 giây — tap mục tiêu
        </div>


        <!-- TOP -->

        <div class="card">

            <div class="label">
                🏆 TOP 10 PLAYERS
            </div>

            <div
                id="leaderboard"
                style="margin-top:8px"
            >
                Đang tải...
            </div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://qsbuwbdyajoxlsrruzzg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Z7BmFlVoVQu3wCjquLsOHQ_joQwJoaT";


/* =========================================================
   GAME CONFIG
========================================================= */

const GAME_SECONDS = 15;

const MAX_ROUNDS_PER_DAY = 100;


/*
    Nếu backend của mày tính reward theo taps
    thì giữ giá trị này.
*/
const REWARD_PER_TAP = 10;


/* =========================================================
   STATE
========================================================= */

let currentUsername = "";

let currentPoints = 0;

let currentRounds = 0;

let currentTaps = 0;

let remainingSeconds = GAME_SECONDS;

let gameRunning = false;

let finishingRound = false;

let countdownTimer = null;


/* =========================================================
   DOM
========================================================= */

const loginScreen =
    document.getElementById("loginScreen");

const gameScreen =
    document.getElementById("gameScreen");

const usernameInput =
    document.getElementById("username");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const pointsElement =
    document.getElementById("points");

const roundsElement =
    document.getElementById("roundsToday");

const roundScoreElement =
    document.getElementById("roundScore");

const timerElement =
    document.getElementById("timer");

const startButton =
    document.getElementById("startButton");

const target =
    document.getElementById("target");

const gameArea =
    document.getElementById("game");

const messageElement =
    document.getElementById("message");

const bonusButton =
    document.getElementById("bonusButton");

const leaderboardElement =
    document.getElementById("leaderboard");


/* =========================================================
   SUPABASE HEADERS
========================================================= */

function supabaseHeaders(){

    return {
        "apikey": SUPABASE_KEY,
        "Authorization":
            "Bearer " + SUPABASE_KEY,
        "Content-Type":
            "application/json"
    };

}


/* =========================================================
   MESSAGE
========================================================= */

function setMessage(text){

    messageElement.textContent = text;

}


/* =========================================================
   FORMAT NUMBER
========================================================= */

function formatNumber(value){

    return Number(value || 0)
        .toLocaleString("en-US");

}


/* =========================================================
   LOGIN
========================================================= */

loginButton.addEventListener(
    "click",
    login
);


usernameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


async function login(){

    const username =
        usernameInput.value.trim();


    loginError.textContent = "";


    if(!username){

        loginError.textContent =
            "Nhập username.";

        return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
        "CONNECTING...";


    try{

        /*
            Kiểm tra player.
        */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/players" +
                "?username=eq." +
                encodeURIComponent(username) +
                "&select=username,points",
                {
                    method:"GET",
                    headers:supabaseHeaders()
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const players =
            await response.json();


        /*
            Nếu chưa có player,
            tạo player.
        */

        if(players.length === 0){

            const createResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/players",
                    {
                        method:"POST",

                        headers:{
                            ...supabaseHeaders(),
                            "Prefer":
                                "return=representation"
                        },

                        body:JSON.stringify({
                            username:username,
                            points:0
                        })
                    }
                );


            if(!createResponse.ok){

                throw new Error(
                    await createResponse.text()
                );

            }

        }


        currentUsername =
            username;


        /*
            Đồng bộ toàn bộ dữ liệu
            trước khi mở game.
        */

        await syncEverything();


        loginScreen.classList.add(
            "hidden"
        );

        gameScreen.classList.remove(
            "hidden"
        );


        setMessage(
            "Đăng nhập thành công ✅"
        );


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        loginError.textContent =
            "❌ " + error.message;


    }finally{

        loginButton.disabled = false;

        loginButton.textContent =
            "ENTER GAME";

    }

}


/* =========================================================
   LOAD PLAYER
========================================================= */

async function loadPlayer(){

    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/players" +
            "?username=eq." +
            encodeURIComponent(currentUsername) +
            "&select=username,points",
            {
                method:"GET",
                headers:supabaseHeaders()
            }
        );


    if(!response.ok){

        throw new Error(
            await response.text()
        );

    }


    const data =
        await response.json();


    if(data.length === 0){

        throw new Error(
            "Không tìm thấy player."
        );

    }


    currentPoints =
        Number(data[0].points || 0);


    pointsElement.textContent =
        formatNumber(currentPoints);

}


/* =========================================================
   VIETNAM DATE
========================================================= */

function vietnamDateString(date){

    return new Intl.DateTimeFormat(
        "en-CA",
        {
            timeZone:
                "Asia/Ho_Chi_Minh",

            year:"numeric",
            month:"2-digit",
            day:"2-digit"
        }
    ).format(date);

}


/* =========================================================
   LOAD ROUNDS
========================================================= */

async function loadRounds(){

    /*
        Không dùng get_rounds_today.

        Đọc trực tiếp game_rounds,
        sau đó lọc theo ngày Việt Nam.
    */


    const url =
        SUPABASE_URL +
        "/rest/v1/game_rounds" +
        "?username=eq." +
        encodeURIComponent(currentUsername) +
        "&select=id,created_at" +
        "&order=created_at.desc";


    const response =
        await fetch(
            url,
            {
                method:"GET",
                headers:supabaseHeaders()
            }
        );


    if(!response.ok){

        console.error(
            "ROUND LOAD ERROR:",
            await response.text()
        );

        return;

    }


    const rounds =
        await response.json();


    const today =
        vietnamDateString(
            new Date()
        );


    let count = 0;


    for(const round of rounds){

        if(!round.created_at){

            continue;

        }


        const roundDate =
            vietnamDateString(
                new Date(
                    round.created_at
                )
            );


        if(roundDate === today){

            count++;

        }

    }


    currentRounds =
        count;


    roundsElement.textContent =
        currentRounds +
        " / " +
        MAX_ROUNDS_PER_DAY;


    /*
        Chỉ khóa START khi không có
        round đang chạy.
    */

    if(
        !gameRunning &&
        !finishingRound
    ){

        if(
            currentRounds >=
            MAX_ROUNDS_PER_DAY
        ){

            startButton.disabled =
                true;

            startButton.textContent =
                "LIMIT REACHED";

        }else{

            startButton.disabled =
                false;

            startButton.textContent =
                "START";

        }

    }

}


/* =========================================================
   LOAD LEADERBOARD
========================================================= */

async function loadLeaderboard(){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/leaderboard" +
                "?select=username,points" +
                "&limit=10",
                {
                    method:"GET",
                    headers:supabaseHeaders()
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const players =
            await response.json();


        if(
            !players ||
            players.length === 0
        ){

            leaderboardElement.textContent =
                "Chưa có người chơi.";

            return;

        }


        leaderboardElement.innerHTML =
            players.map(
                function(player,index){

                    const safeUsername =
                        String(
                            player.username || ""
                        )
                        .replace(
                            /[&<>"']/g,
                            ""
                        );


                    const playerPoints =
                        Number(
                            player.points || 0
                        );


                    return `
                        <div class="rank">
                            <span>
                                ${index + 1}.
                                ${safeUsername}
                            </span>

                            <span class="rank-points">
                                ${formatNumber(
                                    playerPoints
                                )}
                            </span>
                        </div>
                    `;

                }
            ).join("");


    }catch(error){

        console.error(
            "LEADERBOARD ERROR:",
            error
        );


        leaderboardElement.textContent =
            "Không tải được TOP.";

    }

}


/* =========================================================
   SYNC EVERYTHING
========================================================= */

async function syncEverything(){

    await loadPlayer();

    await loadRounds();

    await loadLeaderboard();

}


/* =========================================================
   POSITION TARGET
========================================================= */

function moveTarget(){

    const targetSize = 72;


    const availableWidth =
        gameArea.clientWidth -
        targetSize;


    const availableHeight =
        gameArea.clientHeight -
        targetSize;


    const x =
        Math.max(
            0,
            Math.random() *
            Math.max(
                0,
                availableWidth
            )
        );


    const y =
        Math.max(
            0,
            Math.random() *
            Math.max(
                0,
                availableHeight
            )
        );


    target.style.left =
        x + "px";


    target.style.top =
        y + "px";

}


/* =========================================================
   RESET ROUND UI
========================================================= */

function resetRoundUI(){

    currentTaps = 0;

    remainingSeconds =
        GAME_SECONDS;


    roundScoreElement.textContent =
        "0";


    timerElement.textContent =
        GAME_SECONDS;


    target.style.display =
        "none";


    startButton.style.display =
        "block";

}


/* =========================================================
   START ROUND
========================================================= */

startButton.addEventListener(
    "click",
    startRound
);


async function startRound(){

    /*
        Không cho double click.
    */

    if(gameRunning){

        return;

    }


    if(finishingRound){

        return;

    }


    if(
        currentRounds >=
        MAX_ROUNDS_PER_DAY
    ){

        setMessage(
            "Đã đạt 100 round hôm nay."
        );

        return;

    }


    startButton.disabled = true;

    startButton.textContent =
        "STARTING...";


    setMessage(
        "⏳ Đang bắt đầu round..."
    );


    try{

        /*
            Gọi backend START.
        */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/start_game_round",
                {
                    method:"POST",

                    headers:
                        supabaseHeaders(),

                    body:JSON.stringify({
                        p_username:
                            currentUsername
                    })
                }
            );


        if(!response.ok){

            const errorText =
                await response.text();


            /*
                Có round active từ lần trước.
            */

            if(
                errorText.includes(
                    "Round already active"
                )
            ){

                setMessage(
                    "⚠️ Server đang có round active."
                );


                startButton.disabled =
                    false;

                startButton.textContent =
                    "START";


                return;

            }


            throw new Error(
                errorText
            );

        }


        /*
            START THÀNH CÔNG.
        */

        gameRunning = true;

        finishingRound = false;

        currentTaps = 0;

        remainingSeconds =
            GAME_SECONDS;


        roundScoreElement.textContent =
            "0";


        timerElement.textContent =
            GAME_SECONDS;


        startButton.style.display =
            "none";


        target.style.display =
            "block";


        setMessage(
            "⚡ TAP!"
        );


        moveTarget();


        /*
            Countdown.
        */

        clearInterval(
            countdownTimer
        );


        countdownTimer =
            setInterval(
                function(){

                    remainingSeconds--;


                    timerElement.textContent =
                        remainingSeconds;


                    if(
                        remainingSeconds <= 0
                    ){

                        clearInterval(
                            countdownTimer
                        );

                        countdownTimer =
                            null;


                        finishRound();

                    }

                },
                1000
            );


    }catch(error){

        console.error(
            "START ERROR:",
            error
        );


        gameRunning = false;


        target.style.display =
            "none";


        startButton.style.display =
            "block";


        startButton.disabled =
            false;


        startButton.textContent =
            "START";


        setMessage(
            "❌ " + error.message
        );

    }

}


/* =========================================================
   TAP TARGET
========================================================= */

target.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();


        /*
            Chỉ nhận tap khi round
            thực sự đang chạy.
        */

        if(!gameRunning){

            return;

        }


        if(finishingRound){

            return;

        }


        currentTaps++;


        roundScoreElement.textContent =
            currentTaps;


        moveTarget();

    }
);


/* =========================================================
   FINISH ROUND
========================================================= */

async function finishRound(){

    /*
        Chống finish hai lần.
    */

    if(finishingRound){

        return;

    }


    finishingRound = true;

    gameRunning = false;


    clearInterval(
        countdownTimer
    );

    countdownTimer = null;


    target.style.display =
        "none";


    setMessage(
        "💾 Đang lưu round..."
    );


    try{

        /*
            Gửi số tap lên backend.
        */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/finish_game_round",
                {
                    method:"POST",

                    headers:
                        supabaseHeaders(),

                    body:JSON.stringify({
                        p_username:
                            currentUsername,

                        p_taps:
                            currentTaps
                    })
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        /*
            Backend trả reward.
        */

        const rewardRaw =
            await response.json();


        const reward =
            Number(
                rewardRaw || 0
            );


        /*
            QUAN TRỌNG:
            Không tự cộng POINT.

            Đọc lại DB sau FINISH.
        */

        await loadPlayer();

        await loadRounds();

        await loadLeaderboard();


        roundScoreElement.textContent =
            formatNumber(reward);


        setMessage(
            "🎉 +" +
            formatNumber(reward) +
            " POINT"
        );


    }catch(error){

        console.error(
            "FINISH ERROR:",
            error
        );


        setMessage(
            "❌ " + error.message
        );

    }


    finishingRound = false;


    startButton.style.display =
        "block";


    if(
        currentRounds >=
        MAX_ROUNDS_PER_DAY
    ){

        startButton.disabled =
            true;

        startButton.textContent =
            "LIMIT REACHED";

    }else{

        startButton.disabled =
            false;

        startButton.textContent =
            "START";

    }

}


/* =========================================================
   DAILY BONUS
========================================================= */

bonusButton.addEventListener(
    "click",
    claimDailyBonus
);


async function claimDailyBonus(){

    bonusButton.disabled = true;

    bonusButton.textContent =
        "CHECKING...";


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/claim_daily_bonus",
                {
                    method:"POST",

                    headers:
                        supabaseHeaders(),

                    body:JSON.stringify({
                        p_username:
                            currentUsername
                    })
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const result =
            await response.json();


        const reward =
            Number(
                result || 0
            );


        /*
            Đồng bộ POINT từ DB.
        */

        await loadPlayer();

        await loadLeaderboard();


        if(reward > 0){

            bonusButton.textContent =
                "CLAIMED TODAY";


            setMessage(
                "🎁 +" +
                formatNumber(reward) +
                " POINT"
            );

        }else{

            bonusButton.textContent =
                "ALREADY CLAIMED";

        }


    }catch(error){

        console.error(
            "BONUS ERROR:",
            error
        );


        bonusButton.disabled =
            false;

        bonusButton.textContent =
            "CLAIM BONUS";


        setMessage(
            "❌ " + error.message
        );

    }

}


/* =========================================================
   INITIAL STATE
========================================================= */

function initializeGame(){

    resetRoundUI();

    timerElement.textContent =
        GAME_SECONDS;

    roundScoreElement.textContent =
        "0";

}


initializeGame();


/* =========================================================
   SAFETY: PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    function(){

        /*
            Không tự finish khi đổi tab.
            Timer server/client vẫn giữ nguyên.
        */

        if(
            !document.hidden &&
            currentUsername &&
            !gameRunning &&
            !finishingRound
        ){

            loadPlayer()
                .catch(console.error);

            loadRounds()
                .catch(console.error);

        }

    }
);

</script>

</body>
</html>
