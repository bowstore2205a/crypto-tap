<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Tap</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#070b16;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:min(430px,94vw);
  padding:22px;
  border-radius:24px;
  background:#0d1426;
  border:1px solid #24304a;
}

.logo{
  text-align:center;
  font-size:26px;
  font-weight:900;
  margin-bottom:24px;
}

.logo span{color:#38bdf8}

.card{
  background:#111b30;
  padding:18px;
  border-radius:16px;
  margin-bottom:14px;
}

.label{
  color:#94a3b8;
  font-size:12px;
}

input{
  width:100%;
  padding:14px;
  margin:12px 0;
  border-radius:12px;
  border:1px solid #334155;
  background:#0b1220;
  color:#fff;
  outline:none;
}

button{
  border:0;
  cursor:pointer;
}

.main{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#38bdf8;
  color:#04111c;
  font-weight:900;
}

.main:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.points{
  font-size:38px;
  font-weight:900;
  color:#38bdf8;
  margin-top:5px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#111b30;
  padding:13px;
  border-radius:13px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
  margin-top:4px;
}

.tap-area{
  height:330px;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #24304a;
  background:#09111f;
  margin-top:15px;
}

.target{
  position:absolute;
  width:75px;
  height:75px;
  border-radius:50%;
  background:#38bdf8;
  color:#04111c;
  font-size:25px;
  font-weight:900;
  display:none;
}

.info{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin-top:12px;
}

.hidden{
  display:none;
}

.error{
  color:#fb7185;
  font-size:13px;
  margin-top:10px;
  word-break:break-word;
}

.rank{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #24304a;
}

.rank:last-child{
  border-bottom:0;
}

.rank-name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  max-width:65%;
}

.rank-points{
  color:#38bdf8;
  font-weight:bold;
}

.bonus{
  background:#17243c;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">
⚡ CRYPTO<span>TAP</span>
</div>


<!-- LOGIN -->

<div id="loginScreen">

<div class="card">

<div class="label">
PLAYER
</div>

<input
id="username"
maxlength="30"
placeholder="Nhập username"
>

<button
id="loginButton"
class="main"
>
ENTER GAME
</button>

<div
id="error"
class="error"
></div>

</div>

</div>


<!-- GAME -->

<div
id="gameScreen"
class="hidden"
>


<!-- POINTS -->

<div class="card">

<div class="label">
YOUR POINTS
</div>

<div
id="points"
class="points"
>
0
</div>

</div>


<!-- DAILY BONUS -->

<div class="card bonus">

<div class="label">
🎁 DAILY BONUS
</div>

<div
style="
margin-top:6px;
font-size:18px;
font-weight:bold;
"
>
+100 POINT
</div>

<button
id="bonusButton"
class="main"
style="margin-top:12px"
>
CLAIM BONUS
</button>

</div>


<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="label">
ROUNDS TODAY
</div>

<strong id="roundsToday">
0 / 100
</strong>

</div>


<div class="stat">

<div class="label">
ROUND SCORE
</div>

<strong id="round">
0
</strong>

</div>

</div>


<!-- GAME -->

<div
id="tapArea"
class="tap-area"
>

<button
id="startButton"
class="main"
style="
position:absolute;
width:180px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
"
>
START
</button>


<button
id="target"
class="target"
>
⚡
</button>

</div>


<div
id="message"
class="info"
>
15 giây — tap mục tiêu để kiếm POINT
</div>


<!-- LEADERBOARD -->

<div class="card">

<div class="label">
🏆 TOP 10 PLAYERS
</div>

<div
id="leaderboard"
style="margin-top:10px"
>
Đang tải...
</div>

</div>

</div>

</div>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://qsbuwbdyajoxlsrruzzg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z7BmFlVoVQu3wCjquLsOHQ_joQwJoaT";


/* ================================
   STATE
================================ */

let username = "";

let totalPoints = 0;

let playing = false;

let taps = 0;

let timer = null;

let timeLeft = 15;


/* ================================
   ELEMENTS
================================ */

const loginScreen =
document.getElementById("loginScreen");

const gameScreen =
document.getElementById("gameScreen");

const usernameInput =
document.getElementById("username");

const loginButton =
document.getElementById("loginButton");

const errorBox =
document.getElementById("error");

const pointsElement =
document.getElementById("points");

const roundsTodayElement =
document.getElementById("roundsToday");

const roundElement =
document.getElementById("round");

const tapArea =
document.getElementById("tapArea");

const target =
document.getElementById("target");

const startButton =
document.getElementById("startButton");

const message =
document.getElementById("message");

const leaderboard =
document.getElementById("leaderboard");

const bonusButton =
document.getElementById("bonusButton");


/* ================================
   HEADERS
================================ */

function apiHeaders(){

return {

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + SUPABASE_KEY

};

}


/* ================================
   LOAD PLAYER
================================ */

async function loadPlayer(){

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/players" +
"?username=eq." +
encodeURIComponent(username) +
"&select=username,points",

{
headers:apiHeaders()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

throw new Error(
"Player not found"
);

}


totalPoints =
Number(data[0].points || 0);


pointsElement.textContent =
totalPoints.toLocaleString();

}


/* ================================
   LOAD ROUNDS
================================ */

async function loadRoundsToday(){

  try{

    const now = new Date();

    const start = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate(),
      0,0,0,0
    );

    const end = new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate() + 1,
      0,0,0,0
    );

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/game_rounds" +
      "?username=eq." +
      encodeURIComponent(username) +
      "&created_at=gte." +
      encodeURIComponent(start.toISOString()) +
      "&created_at=lt." +
      encodeURIComponent(end.toISOString()) +
      "&select=id",
      {
        headers: apiHeaders()
      }
    );

    if(!response.ok){
      throw new Error(await response.text());
    }

    const data = await response.json();

    const count = data.length;

    roundsTodayElement.textContent =
      count + " / 100";

    /*
      Chỉ khóa START khi THỰC SỰ
      chơi đủ 100 round trong hôm nay.
    */

    if(count >= 100){

      startButton.disabled = true;
      startButton.textContent =
        "LIMIT REACHED";

    }else{

      startButton.disabled = false;
      startButton.textContent =
        "START";

    }

  }catch(error){

    console.error(
      "ROUND COUNT ERROR:",
      error
    );

    /*
      Nếu không đọc được số round,
      vẫn cho START hoạt động.
    */

    startButton.disabled = false;
    startButton.textContent =
      "START";

  }

}

/* ================================
   LEADERBOARD
================================ */

async function loadLeaderboard(){

try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/leaderboard" +
"?select=username,points" +
"&limit=10",

{
headers:apiHeaders()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const data =
await response.json();


if(!data.length){

leaderboard.innerHTML =
"Chưa có người chơi.";

return;

}


leaderboard.innerHTML =
data.map(
(player,index)=>{

const safeName =
String(
player.username || ""
).replace(
/[&<>"']/g,
""
);

const points =
Number(
player.points || 0
);


return `

<div class="rank">

<span class="rank-name">
${index + 1}. ${safeName}
</span>

<span class="rank-points">
${points.toLocaleString()}
</span>

</div>

`;

}
).join("");


}catch(error){

console.error(
"LEADERBOARD",
error
);

leaderboard.innerHTML =
"Không tải được TOP.";

}

}


/* ================================
   DAILY BONUS
================================ */

bonusButton.onclick =
async function(){

bonusButton.disabled =
true;

bonusButton.textContent =
"CHECKING...";


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/rpc/claim_daily_bonus",

{

method:"POST",

headers:{
...apiHeaders(),
"Content-Type":
"application/json"
},

body:
JSON.stringify({
p_username:username
})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const reward =
Number(
await response.json()
);


if(reward > 0){

totalPoints +=
reward;

pointsElement.textContent =
totalPoints.toLocaleString();

message.textContent =
"🎁 +" +
reward +
" POINT";

bonusButton.textContent =
"CLAIMED TODAY";

}else{

message.textContent =
"Daily Bonus đã nhận hôm nay.";

bonusButton.textContent =
"ALREADY CLAIMED";

}


await loadLeaderboard();


}catch(error){

console.error(
"BONUS",
error
);

message.textContent =
"Bonus lỗi: " +
error.message;

bonusButton.disabled =
false;

bonusButton.textContent =
"CLAIM BONUS";

}

};


/* ================================
   LOGIN
================================ */

loginButton.onclick =
login;


async function login(){

const name =
usernameInput.value.trim();


if(!name){

errorBox.textContent =
"Nhập username trước.";

return;

}


errorBox.textContent =
"";

loginButton.disabled =
true;

loginButton.textContent =
"CONNECTING...";


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/players" +
"?username=eq." +
encodeURIComponent(name) +
"&select=username,points",

{
headers:apiHeaders()
}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const players =
await response.json();


/* EXISTING PLAYER */

if(players.length){

username =
players[0].username;

}


/* NEW PLAYER */

else{

const create =
await fetch(

SUPABASE_URL +
"/rest/v1/players",

{

method:"POST",

headers:{
...apiHeaders(),

"Content-Type":
"application/json",

"Prefer":
"return=representation"

},

body:
JSON.stringify({

username:name,

points:0

})

}

);


if(!create.ok){

throw new Error(
await create.text()
);

}


const created =
await create.json();


username =
created[0].username;

}


/* LOAD DATA */

await loadPlayer();


/* SHOW GAME */

loginScreen.classList.add(
"hidden"
);

gameScreen.classList.remove(
"hidden"
);

message.textContent =
"Database connected ✅";


await loadRoundsToday();

await loadLeaderboard();


}catch(error){

console.error(
"LOGIN",
error
);

errorBox.textContent =
"Database error: " +
error.message;

}finally{

loginButton.disabled =
false;

loginButton.textContent =
"ENTER GAME";

}

}


/* ================================
   MOVE TARGET
================================ */

function moveTarget(){

const size = 75;

const maxX =
Math.max(
0,
tapArea.clientWidth -
size
);

const maxY =
Math.max(
0,
tapArea.clientHeight -
size
);


target.style.left =
Math.random() *
maxX +
"px";

target.style.top =
Math.random() *
maxY +
"px";

}


/* ================================
   START GAME
================================ */

startButton.onclick =
startRound;


function startRound(){

if(playing)
return;


if(startButton.disabled)
return;


playing =
true;

taps =
0;

timeLeft =
15;


roundElement.textContent =
"0";

startButton.style.display =
"none";

target.style.display =
"block";

message.textContent =
"⚡ TAP!";


moveTarget();


timer =
setInterval(

function(){

timeLeft--;

if(timeLeft <= 0){

endRound();

}

},

1000

);

}


/* ================================
   TAP TARGET
================================ */

target.onclick =
function(){

if(!playing)
return;


taps++;

roundElement.textContent =
taps;


moveTarget();

};


/* ================================
   END ROUND
================================ */

async function endRound(){

if(!playing)
return;


playing =
false;


clearInterval(timer);


target.style.display =
"none";

startButton.style.display =
"block";

startButton.textContent =
"PLAY AGAIN";


message.textContent =
"Đang xác nhận round...";


try{

const response =
await fetch(

SUPABASE_URL +
"/rest/v1/rpc/finish_game_round",

{

method:"POST",

headers:{
...apiHeaders(),

"Content-Type":
"application/json"
},

body:
JSON.stringify({

p_username:
username,

p_taps:
taps

})

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const reward =
Number(
await response.json()
);


totalPoints +=
reward;


pointsElement.textContent =
totalPoints.toLocaleString();


roundElement.textContent =
reward;


message.textContent =
"+" +
reward +
" POINT ✅";


await loadRoundsToday();

await loadLeaderboard();


}catch(error){

console.error(
"ROUND ERROR",
error
);

message.textContent =
"Round lỗi: " +
error.message;

}

}

</script>

</body>
</html>
