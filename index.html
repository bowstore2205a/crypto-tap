<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Tap</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#070b16;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:min(430px,94vw);
  padding:20px;
  background:#0d1426;
  border:1px solid #263451;
  border-radius:22px;
}

.logo{
  text-align:center;
  font-size:27px;
  font-weight:900;
  margin-bottom:18px;
}

.logo span{color:#38bdf8}

.card{
  background:#111b30;
  padding:16px;
  border-radius:14px;
  margin-bottom:12px;
}

.label{
  color:#94a3b8;
  font-size:12px;
}

input{
  width:100%;
  padding:13px;
  margin:10px 0;
  border:1px solid #334155;
  border-radius:10px;
  background:#09111f;
  color:#fff;
  outline:none;
}

button{
  border:0;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}

.main{
  width:100%;
  padding:14px;
  border-radius:11px;
  background:#38bdf8;
  color:#04111c;
  font-weight:900;
}

.main:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.points{
  font-size:38px;
  font-weight:900;
  color:#38bdf8;
  margin-top:4px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#111b30;
  padding:13px;
  border-radius:12px;
  text-align:center;
}

.stat strong{
  display:block;
  margin-top:4px;
  font-size:20px;
}

.timer{
  text-align:center;
  font-size:30px;
  font-weight:900;
  color:#38bdf8;
  margin:12px;
}

.game{
  position:relative;
  width:100%;
  height:330px;
  overflow:hidden;
  background:#09111f;
  border:1px solid #263451;
  border-radius:16px;
}

#startButton{
  position:absolute;
  width:180px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.target{
  display:none;
  position:absolute;
  width:72px;
  height:72px;
  padding:0;
  border-radius:50%;
  background:#38bdf8;
  color:#04111c;
  font-size:26px;
  font-weight:900;
  z-index:20;
  box-shadow:0 0 25px rgba(56,189,248,.35);
}

.message{
  min-height:20px;
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin:10px;
}

.error{
  color:#fb7185;
  font-size:13px;
  margin-top:8px;
  word-break:break-word;
}

.hidden{display:none}

.rank{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid #263451;
}

.rank:last-child{border-bottom:0}

.rank-points{
  color:#38bdf8;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">⚡ CRYPTO<span>TAP</span></div>

<!-- LOGIN -->

<div id="loginScreen">

  <div class="card">

    <div class="label">PLAYER</div>

    <input
      id="username"
      maxlength="30"
      placeholder="Nhập username"
      autocomplete="off"
    >

    <button
      id="loginButton"
      class="main"
    >
      ENTER GAME
    </button>

    <div id="error" class="error"></div>

  </div>

</div>


<!-- GAME -->

<div id="gameScreen" class="hidden">

  <div class="card">

    <div class="label">YOUR POINTS</div>

    <div id="points" class="points">0</div>

  </div>


  <div class="card">

    <div class="label">🎁 DAILY BONUS</div>

    <div style="font-size:18px;font-weight:bold;margin-top:5px">
      +100 POINT
    </div>

    <button
      id="bonusButton"
      class="main"
      style="margin-top:10px"
    >
      CLAIM BONUS
    </button>

  </div>


  <div class="stats">

    <div class="stat">
      <div class="label">ROUNDS TODAY</div>
      <strong id="roundsToday">0 / 100</strong>
    </div>

    <div class="stat">
      <div class="label">ROUND SCORE</div>
      <strong id="roundScore">0</strong>
    </div>

  </div>


  <div id="timer" class="timer">15</div>


  <div id="game" class="game">

    <button
      id="startButton"
      class="main"
    >
      START
    </button>

    <button
      id="target"
      class="target"
      type="button"
    >
      ⚡
    </button>

  </div>


  <div id="message" class="message">
    15 giây — tap mục tiêu
  </div>


  <div class="card">

    <div class="label">🏆 TOP 10 PLAYERS</div>

    <div
      id="leaderboard"
      style="margin-top:8px"
    >
      Đang tải...
    </div>

  </div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qsbuwbdyajoxlsrruzzg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z7BmFlVoVQu3wCjquLsOHQ_joQwJoaT";


/* =========================
   STATE
========================= */

let username = "";
let points = 0;

let playing = false;
let finishing = false;

let taps = 0;
let seconds = 15;
let timer = null;

let roundsToday = 0;


/* =========================
   ELEMENTS
========================= */

const loginScreen =
document.getElementById("loginScreen");

const gameScreen =
document.getElementById("gameScreen");

const usernameInput =
document.getElementById("username");

const loginButton =
document.getElementById("loginButton");

const errorBox =
document.getElementById("error");

const pointsBox =
document.getElementById("points");

const roundsBox =
document.getElementById("roundsToday");

const roundScoreBox =
document.getElementById("roundScore");

const timerBox =
document.getElementById("timer");

const game =
document.getElementById("game");

const startButton =
document.getElementById("startButton");

const target =
document.getElementById("target");

const message =
document.getElementById("message");

const bonusButton =
document.getElementById("bonusButton");

const leaderboard =
document.getElementById("leaderboard");


/* =========================
   HEADERS
========================= */

function headers(){

  return {
    "apikey":SUPABASE_KEY,
    "Authorization":
      "Bearer " + SUPABASE_KEY,
    "Content-Type":
      "application/json"
  };

}


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
  "click",
  login
);


usernameInput.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter")
      login();

  }
);


async function login(){

  const name =
    usernameInput.value.trim();

  errorBox.textContent = "";

  if(!name){

    errorBox.textContent =
      "Nhập username.";

    return;

  }

  loginButton.disabled = true;
  loginButton.textContent =
    "CONNECTING...";

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/players" +
      "?username=eq." +
      encodeURIComponent(name) +
      "&select=username,points";

    const response =
      await fetch(
        url,
        {
          headers:headers()
        }
      );

    if(!response.ok)
      throw new Error(
        await response.text()
      );

    const data =
      await response.json();


    if(!data.length){

      const create =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/players",
          {
            method:"POST",

            headers:{
              ...headers(),
              "Prefer":
                "return=representation"
            },

            body:JSON.stringify({
              username:name,
              points:0
            })
          }
        );

      if(!create.ok)
        throw new Error(
          await create.text()
        );

    }


    username = name;


    await loadPlayer();
    await loadRounds();
    await loadLeaderboard();


    loginScreen.classList.add(
      "hidden"
    );

    gameScreen.classList.remove(
      "hidden"
    );

    message.textContent =
      "Connected ✅";


  }catch(error){

    console.error(
      "LOGIN:",
      error
    );

    errorBox.textContent =
      "❌ " + error.message;

  }finally{

    loginButton.disabled = false;

    loginButton.textContent =
      "ENTER GAME";

  }

}


/* =========================
   LOAD PLAYER
========================= */

async function loadPlayer(){

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/players" +
      "?username=eq." +
      encodeURIComponent(username) +
      "&select=points",
      {
        headers:headers()
      }
    );

  if(!response.ok)
    throw new Error(
      await response.text()
    );

  const data =
    await response.json();

  if(!data.length)
    throw new Error(
      "Player not found"
    );

  points =
    Number(data[0].points || 0);

  pointsBox.textContent =
    points.toLocaleString();

}


/* =========================
   LOAD ROUNDS
========================= */

async function loadRounds(){

  /*
    Đọc trực tiếp game_rounds.
    Không phụ thuộc RPC get_rounds_today.
  */

  const today =
    new Date();

  const year =
    today.getFullYear();

  const month =
    String(
      today.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      today.getDate()
    ).padStart(2,"0");


  const start =
    `${year}-${month}-${day}T00:00:00+07:00`;

  const endDate =
    new Date(
      new Date(start).getTime()
      + 86400000
    );


  const end =
    endDate.toISOString();


  const url =
    SUPABASE_URL +
    "/rest/v1/game_rounds" +
    "?username=eq." +
    encodeURIComponent(username) +
    "&created_at=gte." +
    encodeURIComponent(start) +
    "&created_at=lt." +
    encodeURIComponent(end) +
    "&select=id";


  const response =
    await fetch(
      url,
      {
        headers:headers()
      }
    );


  if(!response.ok){

    console.error(
      "LOAD ROUNDS:",
      await response.text()
    );

    return;

  }


  const data =
    await response.json();


  roundsToday =
    data.length;


  roundsBox.textContent =
    roundsToday + " / 100";


  if(
    !playing &&
    !finishing
  ){

    if(roundsToday >= 100){

      startButton.disabled = true;

      startButton.textContent =
        "LIMIT REACHED";

    }else{

      startButton.disabled = false;

      startButton.textContent =
        "START";

    }

  }

}


/* =========================
   START
========================= */

startButton.addEventListener(
  "click",
  startRound
);


async function startRound(){

  if(playing || finishing)
    return;

  if(roundsToday >= 100)
    return;


  startButton.disabled = true;

  startButton.textContent =
    "STARTING...";

  message.textContent =
    "⏳ Đang bắt đầu round...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/start_game_round",
        {
          method:"POST",

          headers:headers(),

          body:JSON.stringify({
            p_username:username
          })
        }
      );


    if(!response.ok){

      const text =
        await response.text();


      if(
        text.includes(
          "Round already active"
        )
      ){

        message.textContent =
          "⚡ Round đang chạy rồi!";

        startButton.disabled = true;

        startButton.textContent =
          "ROUND RUNNING";

        return;

      }


      throw new Error(text);

    }


    /*
      SERVER ĐÃ START THÀNH CÔNG
    */

    playing = true;
    finishing = false;

    taps = 0;
    seconds = 15;


    roundScoreBox.textContent =
      "0";

    timerBox.textContent =
      "15";


    startButton.style.display =
      "none";

    target.style.display =
      "block";


    message.textContent =
      "⚡ TAP!";


    moveTarget();


    timer =
      setInterval(
        function(){

          seconds--;

          timerBox.textContent =
            seconds;


          if(seconds <= 0){

            clearInterval(timer);

            timer = null;

            finishRound();

          }

        },
        1000
      );


  }catch(error){

    console.error(
      "START:",
      error
    );

    playing = false;

    startButton.disabled = false;

    startButton.textContent =
      "START";

    message.textContent =
      "❌ " + error.message;

  }

}


/* =========================
   MOVE TARGET
========================= */

function moveTarget(){

  const size = 72;

  const maxX =
    game.clientWidth -
    size;

  const maxY =
    game.clientHeight -
    size;


  const x =
    Math.max(
      0,
      Math.random() * maxX
    );

  const y =
    Math.max(
      0,
      Math.random() * maxY
    );


  target.style.left =
    x + "px";

  target.style.top =
    y + "px";

}


/* =========================
   TAP
========================= */

target.addEventListener(
  "click",
  function(e){

    e.preventDefault();

    e.stopPropagation();


    if(!playing)
      return;


    taps++;


    roundScoreBox.textContent =
      taps;


    moveTarget();

  }
);


/* =========================
   FINISH
========================= */

async function finishRound(){

  if(finishing)
    return;


  finishing = true;
  playing = false;


  target.style.display =
    "none";


  message.textContent =
    "💾 Đang lưu round...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/finish_game_round",
        {
          method:"POST",

          headers:headers(),

          body:JSON.stringify({
            p_username:username,
            p_taps:taps
          })
        }
      );


    if(!response.ok)
      throw new Error(
        await response.text()
      );


    const reward =
      Number(
        await response.json()
      );


    /*
      QUAN TRỌNG:
      đọc lại DB sau khi FINISH.
    */

    await loadPlayer();

    await loadRounds();

    await loadLeaderboard();


    roundScoreBox.textContent =
      reward;


    message.textContent =
      "🎉 +" +
      reward +
      " POINT";


  }catch(error){

    console.error(
      "FINISH:",
      error
    );

    message.textContent =
      "❌ " + error.message;

  }


  finishing = false;


  startButton.style.display =
    "block";


  if(roundsToday >= 100){

    startButton.disabled = true;

    startButton.textContent =
      "LIMIT REACHED";

  }else{

    startButton.disabled = false;

    startButton.textContent =
      "START";

  }

}


/* =========================
   DAILY BONUS
========================= */

bonusButton.addEventListener(
  "click",
  claimBonus
);


async function claimBonus(){

  bonusButton.disabled = true;

  bonusButton.textContent =
    "CHECKING...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/claim_daily_bonus",
        {
          method:"POST",

          headers:headers(),

          body:JSON.stringify({
            p_username:username
          })
        }
      );


    if(!response.ok)
      throw new Error(
        await response.text()
      );


    const reward =
      Number(
        await response.json()
      );


    if(reward > 0){

      await loadPlayer();

      await loadLeaderboard();


      bonusButton.textContent =
        "CLAIMED TODAY";


      message.textContent =
        "🎁 +" +
        reward +
        " POINT";

    }else{

      bonusButton.textContent =
        "ALREADY CLAIMED";

    }


  }catch(error){

    console.error(
      "BONUS:",
      error
    );

    bonusButton.disabled = false;

    bonusButton.textContent =
      "CLAIM BONUS";

    message.textContent =
      "❌ " + error.message;

  }

}


/* =========================
   LEADERBOARD
========================= */

async function loadLeaderboard(){

  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/leaderboard" +
        "?select=username,points" +
        "&limit=10",
        {
          headers:headers()
        }
      );


    if(!response.ok)
      throw new Error(
        await response.text()
      );


    const data =
      await response.json();


    if(!data.length){

      leaderboard.innerHTML =
        "Chưa có người chơi.";

      return;

    }


    leaderboard.innerHTML =
      data.map(
        function(player,index){

          const safeName =
            String(
              player.username || ""
            ).replace(
              /[&<>"']/g,
              ""
            );


          const score =
            Number(
              player.points || 0
            );


          return `
            <div class="rank">
              <span>
                ${index+1}. ${safeName}
              </span>

              <span class="rank-points">
                ${score.toLocaleString()}
              </span>
            </div>
          `;

        }
      ).join("");


  }catch(error){

    console.error(
      "LEADERBOARD:",
      error
    );

    leaderboard.innerHTML =
      "Không tải được TOP.";

  }

}

</script>

</body>
</html>
