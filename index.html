<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Tap</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    background:#070b16;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app{
    width:min(430px,94vw);
    min-height:700px;
    padding:20px;
    border-radius:24px;
    background:#0d1426;
    border:1px solid #24304a;
}

.header{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.logo span{color:#38bdf8}

.small{
    color:#94a3b8;
    font-size:12px;
}

.login{
    text-align:center;
    padding:30px 10px;
}

.login h1{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:14px;
    margin-top:12px;
    border-radius:12px;
    border:1px solid #334155;
    background:#111b30;
    color:white;
    outline:none;
}

button{
    cursor:pointer;
}

.main-btn{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:12px;
    background:#38bdf8;
    color:#04111c;
    font-weight:800;
}

.error{
    color:#fb7185;
    margin-top:10px;
    font-size:13px;
}

.hidden{display:none}

.balance{
    background:#111b30;
    padding:18px;
    border-radius:16px;
    margin-bottom:14px;
}

.balance-title{
    color:#94a3b8;
    font-size:12px;
}

.points{
    color:#38bdf8;
    font-size:30px;
    font-weight:900;
    margin-top:5px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.stat{
    background:#111b30;
    padding:14px;
    border-radius:14px;
}

.arena{
    height:390px;
    margin-top:14px;
    position:relative;
    overflow:hidden;
    border-radius:18px;
    border:1px solid #24304a;
    background:
      linear-gradient(#ffffff08 1px,transparent 1px),
      linear-gradient(90deg,#ffffff08 1px,transparent 1px);
    background-size:30px 30px;
}

.start{
    position:absolute;
    inset:0;
    margin:auto;
    width:180px;
    height:55px;
    border:0;
    border-radius:14px;
    background:#38bdf8;
    font-weight:800;
}

.target{
    position:absolute;
    width:72px;
    height:72px;
    border:0;
    border-radius:50%;
    background:linear-gradient(135deg,#38bdf8,#6366f1);
    color:#fff;
    font-size:28px;
    box-shadow:0 0 25px #38bdf877;
}

.info{
    text-align:center;
    color:#94a3b8;
    font-size:13px;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
    <div class="logo">⚡ CRYPTO<span>TAP</span></div>
    <div class="small">MVP v0.2</div>
</div>

<!-- LOGIN -->

<div id="loginScreen" class="login">

    <h1>🎮 Welcome</h1>

    <p class="small">
        Nhập username để bắt đầu.
    </p>

    <input
        id="usernameInput"
        maxlength="20"
        placeholder="Tên của bạn"
    >

    <button class="main-btn" id="loginBtn">
        ENTER GAME
    </button>

    <div id="error" class="error"></div>

</div>

<!-- GAME -->

<div id="gameScreen" class="hidden">

    <div class="balance">

        <div class="balance-title">
            YOUR POINTS
        </div>

        <div class="points" id="points">
            0
        </div>

    </div>

    <div class="stats">

        <div class="stat">
            <div class="small">TIME</div>
            <strong id="timer">15</strong>
        </div>

        <div class="stat">
            <div class="small">ROUND</div>
            <strong id="roundScore">0</strong>
        </div>

    </div>

    <div class="arena" id="arena">

        <button class="start" id="startBtn">
            ⚡ START GAME
        </button>

        <button
            class="target"
            id="target"
            style="display:none"
        >
            ⚡
        </button>

    </div>

    <div class="info" id="message">
        Chơi 15 giây để kiếm POINT
    </div>

</div>

</div>

<script>

/*
  Supabase connection
*/

const SUPABASE_URL =
"https://qsbuwbdyajoxlsrruzzg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z7BmFlVoVQu3wCjquLsOHQ_joQwJoaT";


/*
  Game variables
*/

let currentUser = null;
let currentPoints = 0;

let score = 0;
let timeLeft = 15;
let playing = false;
let timer = null;


/*
  Elements
*/

const loginScreen =
document.getElementById("loginScreen");

const gameScreen =
document.getElementById("gameScreen");

const usernameInput =
document.getElementById("usernameInput");

const loginBtn =
document.getElementById("loginBtn");

const errorBox =
document.getElementById("error");

const pointsElement =
document.getElementById("points");

const arena =
document.getElementById("arena");

const target =
document.getElementById("target");

const startBtn =
document.getElementById("startBtn");

const timerElement =
document.getElementById("timer");

const roundScore =
document.getElementById("roundScore");

const message =
document.getElementById("message");


/*
  Login
*/

loginBtn.addEventListener("click", async () => {

    const username =
        usernameInput.value.trim();

    if (!username) {

        errorBox.textContent =
            "Nhập username trước.";

        return;
    }

    errorBox.textContent = "";

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/players?user=eq." +
                encodeURIComponent(username) +
                "&select=*",
                {
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                        "Bearer " + SUPABASE_KEY
                    }
                }
            );

        const users =
            await response.json();

        if (users.length > 0) {

            currentUser =
                users[0].user;

            currentPoints =
                Number(users[0].point || 0);

        } else {

            const create =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/players",
                    {
                        method:"POST",

                        headers:{
                            "apikey":SUPABASE_KEY,
                            "Authorization":
                            "Bearer " + SUPABASE_KEY,
                            "Content-Type":
                            "application/json",
                            "Prefer":
                            "return=representation"
                        },

                        body:JSON.stringify({
                            user:username,
                            point:0
                        })
                    }
                );

            const created =
                await create.json();

            if (!create.ok) {

                throw new Error(
                    JSON.stringify(created)
                );
            }

            currentUser =
                created[0].user;

            currentPoints = 0;
        }

        pointsElement.textContent =
            currentPoints.toLocaleString();

        loginScreen.classList.add("hidden");
        gameScreen.classList.remove("hidden");

    } catch(error) {

        console.error(error);

        errorBox.textContent =
            "Không kết nối được database.";
    }

});


/*
  Move target
*/

function moveTarget(){

    const size = 72;

    const x =
        Math.random() *
        (arena.clientWidth - size);

    const y =
        Math.random() *
        (arena.clientHeight - size);

    target.style.left =
        x + "px";

    target.style.top =
        y + "px";
}


/*
  Start game
*/

startBtn.addEventListener("click", () => {

    if (playing) return;

    playing = true;

    score = 0;
    timeLeft = 15;

    roundScore.textContent = 0;
    timerElement.textContent = 15;

    startBtn.style.display = "none";
    target.style.display = "block";

    message.textContent =
        "⚡ TAP CÀNG NHANH CÀNG TỐT!";

    moveTarget();

    timer =
        setInterval(() => {

            timeLeft--;

            timerElement.textContent =
                timeLeft;

            if (timeLeft <= 0) {

                endGame();

            }

        },1000);

});


/*
  Tap
*/

target.addEventListener("click", () => {

    if (!playing) return;

    score += 10;

    roundScore.textContent =
        score;

    moveTarget();

});


/*
  End game
*/

async function endGame(){

    playing = false;

    clearInterval(timer);

    target.style.display = "none";

    startBtn.style.display = "block";

    startBtn.textContent =
        "⚡ PLAY AGAIN";

    message.textContent =
        "Đang lưu POINT...";

    currentPoints += score;

    pointsElement.textContent =
        currentPoints.toLocaleString();


    /*
      Save points
    */

    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/players?user=eq." +
                encodeURIComponent(currentUser),
                {
                    method:"PATCH",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                        "Bearer " + SUPABASE_KEY,
                        "Content-Type":
                        "application/json"
                    },

                    body:JSON.stringify({
                        point:currentPoints
                    })
                }
            );

        if (!response.ok) {

            throw new Error(
                await response.text()
            );

        }

        message.textContent =
            "+" + score +
            " POINT đã được lưu!";

    } catch(error) {

        console.error(error);

        message.textContent =
            "Không lưu được POINT.";

    }

}

</script>

</body>
</html
