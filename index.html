<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Tap</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#070b16;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:min(430px,94vw);
  padding:22px;
  border-radius:24px;
  background:#0d1426;
  border:1px solid #24304a;
}

.logo{
  text-align:center;
  font-size:26px;
  font-weight:900;
  margin-bottom:24px;
}

.logo span{color:#38bdf8}

.card{
  background:#111b30;
  padding:18px;
  border-radius:16px;
  margin-bottom:14px;
}

.label{
  color:#94a3b8;
  font-size:12px;
}

input{
  width:100%;
  padding:14px;
  margin:12px 0;
  border-radius:12px;
  border:1px solid #334155;
  background:#0b1220;
  color:#fff;
  outline:none;
}

button{
  border:0;
  cursor:pointer;
}

.main{
  width:100%;
  padding:14px;
  border-radius:12px;
  background:#38bdf8;
  color:#04111c;
  font-weight:900;
}

.points{
  font-size:38px;
  font-weight:900;
  color:#38bdf8;
  margin-top:5px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#111b30;
  padding:13px;
  border-radius:13px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:20px;
  margin-top:4px;
}

.tap-area{
  height:330px;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #24304a;
  background:#09111f;
  margin-top:15px;
}

.target{
  position:absolute;
  width:75px;
  height:75px;
  border-radius:50%;
  background:#38bdf8;
  color:#04111c;
  font-size:25px;
  font-weight:900;
  display:none;
}

.info{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin-top:12px;
}

.hidden{display:none}

.error{
  color:#fb7185;
  font-size:13px;
  margin-top:10px;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="app">

<div class="logo">
⚡ CRYPTO<span>TAP</span>
</div>


<!-- LOGIN -->

<div id="loginScreen">

  <div class="card">

    <div class="label">
      PLAYER
    </div>

    <input
      id="username"
      maxlength="30"
      placeholder="Nhập username"
    >

    <button
      class="main"
      id="loginButton"
    >
      ENTER GAME
    </button>

    <div
      id="error"
      class="error"
    ></div>

  </div>

</div>


<!-- GAME -->

<div
  id="gameScreen"
  class="hidden"


  <div class="card">

    <div class="label">
      YOUR POINTS
    </div>

    <div
      id="points"
      class="points"
    >
      0
    </div>

  </div>


  <div class="stats">

    <div class="stat">

      <div class="label">
        TIME
      </div>

      <strong id="time">
        15
      </strong>

    </div>


    <div class="stat">

      <div class="label">
        TAPS
      </div>

      <strong id="round">
        0
      </strong>

    </div>

  </div>


  <div
    class="tap-area"
    id="tapArea"
  >

    <button
      id="startButton"
      class="main"
      style="
        position:absolute;
        width:180px;
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
      "
    >
      START
    </button>


    <button
      id="target"
      class="target"
    >
      ⚡
    </button>

  </div>


  <div
    id="message"
    class="info"
  >
    15 giây — tap mục tiêu để kiếm POINT
  </div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://qsbuwbdyajoxlsrruzzg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Z7BmFlVoVQu3wCjquLsOHQ_joQwJoaT";


/* =========================
   STATE
========================= */

let username = "";
let totalPoints = 0;

let playing = false;
let taps = 0;
let timeLeft = 15;
let timer = null;


/* =========================
   ELEMENTS
========================= */

const loginScreen =
document.getElementById("loginScreen");

const gameScreen =
document.getElementById("gameScreen");

const usernameInput =
document.getElementById("username");

const loginButton =
document.getElementById("loginButton");

const errorBox =
document.getElementById("error");

const pointsElement =
document.getElementById("points");

const timeElement =
document.getElementById("time");

const roundElement =
document.getElementById("round");

const tapArea =
document.getElementById("tapArea");

const target =
document.getElementById("target");

const startButton =
document.getElementById("startButton");

const message =
document.getElementById("message");


/* =========================
   HEADERS
========================= */

function apiHeaders(extra = {}){

  return {
    "apikey": SUPABASE_KEY,
    "Authorization":
      "Bearer " + SUPABASE_KEY,
    ...extra
  };

}


/* =========================
   LOGIN
========================= */

loginButton.onclick = login;

async function login(){

  const name =
    usernameInput.value.trim();

  errorBox.textContent = "";

  if(!name){

    errorBox.textContent =
      "Nhập username trước.";

    return;
  }

  loginButton.disabled = true;

  loginButton.textContent =
    "CONNECTING...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/players" +
        "?username=eq." +
        encodeURIComponent(name) +
        "&select=id,username,points",
        {
          headers:
            apiHeaders()
        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const players =
      await response.json();


    /* PLAYER CŨ */

    if(players.length > 0){

      username =
        players[0].username;

      totalPoints =
        Number(
          players[0].points || 0
        );

    }


    /* PLAYER MỚI */

    else{

      const create =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/players",
          {
            method:"POST",

            headers:
              apiHeaders({
                "Content-Type":
                  "application/json",

                "Prefer":
                  "return=representation"
              }),

            body:
              JSON.stringify({
                username:name,
                points:0
              })
          }
        );


      if(!create.ok){

        throw new Error(
          await create.text()
        );

      }


      const created =
        await create.json();


      username =
        created[0].username;

      totalPoints = 0;

    }


    pointsElement.textContent =
      totalPoints.toLocaleString();


    loginScreen.classList.add(
      "hidden"
    );

    gameScreen.classList.remove(
      "hidden"
    );


    message.textContent =
      "Database connected ✅";


  }

  catch(error){

    console.error(error);

    errorBox.textContent =
      "Database error: " +
      error.message;

  }


  finally{

    loginButton.disabled = false;

    loginButton.textContent =
      "ENTER GAME";

  }

}


/* =========================
   TARGET POSITION
========================= */

function moveTarget(){

  const size = 75;

  const maxX =
    tapArea.clientWidth - size;

  const maxY =
    tapArea.clientHeight - size;

  target.style.left =
    Math.random() * maxX + "px";

  target.style.top =
    Math.random() * maxY + "px";

}


/* =========================
   START ROUND
========================= */

startButton.onclick =
startRound;


function startRound(){

  if(playing) return;

  playing = true;

  taps = 0;

  timeLeft = 15;


  roundElement.textContent =
    "0";

  timeElement.textContent =
    "15";


  startButton.style.display =
    "none";

  target.style.display =
    "block";


  message.textContent =
    "⚡ TAP!";


  moveTarget();


  timer =
    setInterval(

      () => {

        timeLeft--;

        timeElement.textContent =
          timeLeft;


        if(timeLeft <= 0){

          endRound();

        }

      },

      1000

    );

}


/* =========================
   TAP
========================= */

target.onclick = () => {

  if(!playing) return;

  taps++;

  roundElement.textContent =
    taps;

  moveTarget();

};


/* =========================
   FINISH ROUND
========================= */

async function endRound(){

  if(!playing) return;


  playing = false;

  clearInterval(timer);


  target.style.display =
    "none";

  startButton.style.display =
    "block";

  startButton.textContent =
    "PLAY AGAIN";


  message.textContent =
    "Đang xác nhận round...";


  try{

    /*
      Chỉ gửi USERNAME + TAPS.

      Server tự tính:
      reward = taps × 10
    */

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/finish_game_round",
        {
          method:"POST",

          headers:
            apiHeaders({
              "Content-Type":
                "application/json"
            }),

          body:
            JSON.stringify({

              p_username:
                username,

              p_taps:
                taps

            })
        }
      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    const reward =
      Number(
        await response.json()
      );


    totalPoints += reward;


    pointsElement.textContent =
      totalPoints.toLocaleString();


    message.textContent =
      "+" +
      reward +
      " POINT ✅";


  }

  catch(error){

    console.error(error);

    message.textContent =
      "Round lỗi: " +
      error.message;

  }

}

</script>

</body>
</html>
