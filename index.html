<script>

const SUPABASE_URL =
    "https://qsbuwbdyajoxlsrruzzg.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Z7BmFlVoVQu3wCjquLsOHQ_joQwJoaT";

const ROUND_SECONDS = 15;
const MAX_ROUNDS = 100;

let username = "";
let points = 0;
let rounds = 0;
let taps = 0;
let seconds = ROUND_SECONDS;

let playing = false;
let finishing = false;
let countdown = null;


/* =========================
   ELEMENTS
========================= */

const usernameInput =
    document.getElementById("username");

const loginButton =
    document.getElementById("loginButton");

const loginScreen =
    document.getElementById("loginScreen");

const gameScreen =
    document.getElementById("gameScreen");

const loginError =
    document.getElementById("loginError");

const pointsElement =
    document.getElementById("points");

const roundsElement =
    document.getElementById("roundsToday");

const roundScoreElement =
    document.getElementById("roundScore");

const timerElement =
    document.getElementById("timer");

const startButton =
    document.getElementById("startButton");

const target =
    document.getElementById("target");

const game =
    document.getElementById("game");

const messageElement =
    document.getElementById("message");

const bonusButton =
    document.getElementById("bonusButton");

const leaderboardElement =
    document.getElementById("leaderboard");


/* =========================
   SUPABASE HEADERS
========================= */

function supabaseHeaders(){

    return {
        "apikey": SUPABASE_KEY,
        "Authorization":
            "Bearer " + SUPABASE_KEY,
        "Content-Type":
            "application/json"
    };

}


/* =========================
   MESSAGE
========================= */

function message(text){

    if(messageElement){
        messageElement.textContent = text;
    }

}


/* =========================
   POINTS
========================= */

async function loadPoints(){

    const response =
        await fetch(
            SUPABASE_URL +
            "/rest/v1/players" +
            "?username=eq." +
            encodeURIComponent(username) +
            "&select=points",
            {
                method:"GET",
                headers:supabaseHeaders()
            }
        );


    if(!response.ok){

        throw new Error(
            await response.text()
        );

    }


    const data =
        await response.json();


    if(!data.length){

        throw new Error(
            "Không tìm thấy player."
        );

    }


    points =
        Number(data[0].points || 0);


    pointsElement.textContent =
        points.toLocaleString();

}


/* =========================
   ROUNDS
========================= */

async function loadRounds(){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/get_rounds_today",
                {
                    method:"POST",

                    headers:
                        supabaseHeaders(),

                    body:JSON.stringify({
                        p_username:username
                    })
                }
            );


        const raw =
            await response.text();


        console.log(
            "ROUND RPC:",
            response.status,
            raw
        );


        if(!response.ok){

            throw new Error(
                "RPC " +
                response.status +
                ": " +
                raw
            );

        }


        let result;


        try{

            result =
                JSON.parse(raw);

        }catch{

            result =
                raw;

        }


        let value = 0;


        /*
            RPC trả trực tiếp:
            2
        */

        if(
            typeof result ===
            "number"
        ){

            value =
                result;

        }


        /*
            RPC trả:
            "2"
        */

        else if(
            typeof result ===
            "string"
        ){

            value =
                Number(result);

        }


        /*
            RPC trả:
            [{...}]
        */

        else if(
            Array.isArray(result)
        ){

            if(result.length){

                const row =
                    result[0];

                value =
                    Number(
                        row.rounds_today ??
                        row.count ??
                        row.get_rounds_today ??
                        Object.values(row)[0] ??
                        0
                    );

            }

        }


        /*
            RPC trả:
            {...}
        */

        else if(
            result &&
            typeof result ===
            "object"
        ){

            value =
                Number(
                    result.rounds_today ??
                    result.count ??
                    result.get_rounds_today ??
                    Object.values(result)[0] ??
                    0
                );

        }


        if(
            !Number.isFinite(value)
        ){

            value = 0;

        }


        rounds = value;


        /*
            ÉP UI CẬP NHẬT TRỰC TIẾP
        */

        const element =
            document.getElementById(
                "roundsToday"
            );


        if(!element){

            throw new Error(
                "Không tìm thấy #roundsToday"
            );

        }


        element.textContent =
            rounds + " / " + MAX_ROUNDS;


        console.log(
            "ROUND DISPLAY:",
            element.textContent
        );


        /*
            START BUTTON
        */

        if(
            !playing &&
            !finishing
        ){

            if(
                rounds >=
                MAX_ROUNDS
            ){

                startButton.disabled =
                    true;

                startButton.textContent =
                    "LIMIT REACHED";

            }else{

                startButton.disabled =
                    false;

                startButton.textContent =
                    "START";

            }

        }


        return rounds;


    }catch(error){

        console.error(
            "LOAD ROUNDS ERROR:",
            error
        );


        /*
            KHÔNG reset về 0 nếu
            request lỗi.
        */

        if(
            roundsElement &&
            Number.isFinite(rounds)
        ){

            roundsElement.textContent =
                rounds +
                " / " +
                MAX_ROUNDS;

        }

        return rounds;

    }

}


/* =========================
   LEADERBOARD
========================= */

async function loadLeaderboard(){

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/leaderboard" +
                "?select=username,points" +
                "&limit=10",
                {
                    method:"GET",
                    headers:
                        supabaseHeaders()
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const data =
            await response.json();


        if(!data.length){

            leaderboardElement.textContent =
                "Chưa có người chơi.";

            return;

        }


        leaderboardElement.innerHTML =
            data.map(
                (player,index)=>{

                    const name =
                        String(
                            player.username ||
                            ""
                        )
                        .replace(
                            /[&<>"']/g,
                            ""
                        );


                    const score =
                        Number(
                            player.points ||
                            0
                        );


                    return `
                        <div class="rank">
                            <span>
                                ${index + 1}. ${name}
                            </span>

                            <span class="rank-points">
                                ${score.toLocaleString()}
                            </span>
                        </div>
                    `;

                }
            ).join("");


    }catch(error){

        console.error(
            "LEADERBOARD:",
            error
        );

    }

}


/* =========================
   LOGIN
========================= */

loginButton.addEventListener(
    "click",
    login
);


usernameInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            login();

        }

    }
);


async function login(){

    const name =
        usernameInput.value.trim();


    loginError.textContent = "";


    if(!name){

        loginError.textContent =
            "Nhập username.";

        return;

    }


    loginButton.disabled =
        true;


    loginButton.textContent =
        "CONNECTING...";


    try{

        /*
            CHECK PLAYER
        */

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/players" +
                "?username=eq." +
                encodeURIComponent(name) +
                "&select=username,points",
                {
                    method:"GET",
                    headers:
                        supabaseHeaders()
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const players =
            await response.json();


        /*
            CREATE IF NEEDED
        */

        if(!players.length){

            const create =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/players",
                    {
                        method:"POST",

                        headers:{
                            ...supabaseHeaders(),

                            "Prefer":
                                "return=representation"
                        },

                        body:
                            JSON.stringify({
                                username:name,
                                points:0
                            })
                    }
                );


            if(!create.ok){

                throw new Error(
                    await create.text()
                );

            }

        }


        username =
            name;


        /*
            LOAD DATA
        */

        await loadPoints();

        await loadRounds();

        await loadLeaderboard();


        /*
            SHOW GAME
        */

        loginScreen.classList.add(
            "hidden"
        );

        gameScreen.classList.remove(
            "hidden"
        );


        /*
            LOAD ROUNDS LẦN CUỐI
            SAU KHI GAME SCREEN HIỆN
        */

        await loadRounds();


        message(
            "Đăng nhập thành công ✅"
        );


    }catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );


        loginError.textContent =
            "❌ " +
            error.message;


    }finally{

        loginButton.disabled =
            false;

        loginButton.textContent =
            "ENTER GAME";

    }

}


/* =========================
   MOVE TARGET
========================= */

function moveTarget(){

    const size = 72;


    const maxX =
        Math.max(
            0,
            game.clientWidth -
            size
        );


    const maxY =
        Math.max(
            0,
            game.clientHeight -
            size
        );


    target.style.left =
        Math.random() *
        maxX +
        "px";


    target.style.top =
        Math.random() *
        maxY +
        "px";

}


/* =========================
   START ROUND
========================= */

startButton.addEventListener(
    "click",
    startRound
);


async function startRound(){

    if(playing)return;

    if(finishing)return;


    /*
        LUÔN ĐỌC ROUND MỚI NHẤT
        TRƯỚC KHI START
    */

    await loadRounds();


    if(
        rounds >=
        MAX_ROUNDS
    ){

        message(
            "Đã đủ 100 round hôm nay."
        );

        return;

    }


    startButton.disabled =
        true;


    startButton.textContent =
        "STARTING...";


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/start_game_round",
                {
                    method:"POST",

                    headers:
                        supabaseHeaders(),

                    body:
                        JSON.stringify({
                            p_username:
                                username
                        })
                }
            );


        const raw =
            await response.text();


        if(!response.ok){

            if(
                raw.includes(
                    "Round already active"
                )
            ){

                message(
                    "⚠️ Round đang active."
                );

                startButton.disabled =
                    false;

                startButton.textContent =
                    "START";

                return;

            }


            throw new Error(
                raw
            );

        }


        playing = true;

        finishing = false;

        taps = 0;

        seconds =
            ROUND_SECONDS;


        roundScoreElement.textContent =
            "0";

        timerElement.textContent =
            seconds;


        startButton.style.display =
            "none";


        target.style.display =
            "block";


        message(
            "⚡ TAP!"
        );


        moveTarget();


        clearInterval(
            countdown
        );


        countdown =
            setInterval(
                function(){

                    seconds--;


                    timerElement.textContent =
                        seconds;


                    if(
                        seconds <= 0
                    ){

                        clearInterval(
                            countdown
                        );

                        countdown =
                            null;


                        finishRound();

                    }

                },
                1000
            );


    }catch(error){

        console.error(
            "START:",
            error
        );


        playing = false;


        target.style.display =
            "none";


        startButton.style.display =
            "block";


        startButton.disabled =
            false;


        startButton.textContent =
            "START";


        message(
            "❌ " +
            error.message
        );

    }

}


/* =========================
   TAP
========================= */

target.addEventListener(
    "click",
    function(event){

        event.preventDefault();

        event.stopPropagation();


        if(!playing)return;

        if(finishing)return;


        taps++;


        roundScoreElement.textContent =
            taps;


        moveTarget();

    }
);


/* =========================
   FINISH ROUND
========================= */

async function finishRound(){

    if(finishing)return;


    finishing = true;

    playing = false;


    clearInterval(
        countdown
    );

    countdown = null;


    target.style.display =
        "none";


    message(
        "💾 Đang lưu round..."
    );


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/finish_game_round",
                {
                    method:"POST",

                    headers:
                        supabaseHeaders(),

                    body:
                        JSON.stringify({
                            p_username:
                                username,

                            p_taps:
                                taps
                        })
                }
            );


        const raw =
            await response.text();


        if(!response.ok){

            throw new Error(
                raw
            );

        }


        let reward = 0;


        try{

            reward =
                Number(
                    JSON.parse(raw)
                );

        }catch{

            reward =
                Number(raw || 0);

        }


        /*
            CẬP NHẬT POINT
        */

        await loadPoints();


        /*
            CỰC KỲ QUAN TRỌNG:
            CẬP NHẬT ROUND SAU FINISH
        */

        await loadRounds();


        await loadLeaderboard();


        roundScoreElement.textContent =
            reward.toLocaleString();


        message(
            "🎉 +" +
            reward.toLocaleString() +
            " POINT"
        );


    }catch(error){

        console.error(
            "FINISH:",
            error
        );


        message(
            "❌ " +
            error.message
        );

    }


    finishing = false;


    startButton.style.display =
        "block";


    if(
        rounds >=
        MAX_ROUNDS
    ){

        startButton.disabled =
            true;

        startButton.textContent =
            "LIMIT REACHED";

    }else{

        startButton.disabled =
            false;

        startButton.textContent =
            "START";

    }

}


/* =========================
   BONUS
========================= */

bonusButton.addEventListener(
    "click",
    claimBonus
);


async function claimBonus(){

    bonusButton.disabled =
        true;


    bonusButton.textContent =
        "CHECKING...";


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/rpc/claim_daily_bonus",
                {
                    method:"POST",

                    headers:
                        supabaseHeaders(),

                    body:
                        JSON.stringify({
                            p_username:
                                username
                        })
                }
            );


        const raw =
            await response.text();


        if(!response.ok){

            throw new Error(
                raw
            );

        }


        let reward = 0;


        try{

            reward =
                Number(
                    JSON.parse(raw)
                );

        }catch{

            reward =
                Number(raw || 0);

        }


        await loadPoints();

        await loadLeaderboard();


        if(reward > 0){

            bonusButton.textContent =
                "CLAIMED TODAY";


            message(
                "🎁 +" +
                reward.toLocaleString() +
                " POINT"
            );

        }else{

            bonusButton.textContent =
                "ALREADY CLAIMED";

        }


    }catch(error){

        console.error(
            "BONUS:",
            error
        );


        bonusButton.disabled =
            false;


        bonusButton.textContent =
            "CLAIM BONUS";


        message(
            "❌ " +
            error.message
        );

    }

}


/* =========================
   INITIAL
========================= */

timerElement.textContent =
    ROUND_SECONDS;

roundScoreElement.textContent =
    "0";

</script>
